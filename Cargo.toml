[workspace]
resolver = "3"
members = [
    "crates/core-types",
    "crates/orderbook-l3",
    "crates/microstructure-simd",
    "crates/ml-alpha",
    "crates/strategy-mm",
    "crates/engine-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
core-types = { path = "crates/core-types" }
orderbook-l3 = { path = "crates/orderbook-l3" }
microstructure-simd = { path = "crates/microstructure-simd" }
ml-alpha = { path = "crates/ml-alpha" }
strategy-mm = { path = "crates/strategy-mm" }

thiserror = "2.0"
wide = "1.7"
core_affinity = "0.8"
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
needless_range_loop = "allow"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
debug = true
